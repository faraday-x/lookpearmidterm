<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legends — The Red Legends</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/legends.css" />
</head>
<body class="story-page">

<nav class="site-nav"></nav>

<div class="legends-wrap">

  <div class="legends-page-hero">
    <div class="legends-page-hero-inner">
      <div class="lph-label">Liverpool Football Club</div>
      <h1 class="lph-title">THE LEGENDS</h1>
      <p class="lph-sub">10 Iconic Players &nbsp;·&nbsp; 2 Glorious Eras &nbsp;·&nbsp; The Eternal Heritage of Anfield</p>
    </div>
  </div>

  <section class="era-section" id="section-past">
    <div class="era-header">
      <div>
        <div class="era-badge">Legends of the Past</div>
        <h2 class="era-title">THE FOUNDING GREATS</h2>
      </div>
      <span class="era-count">5 LEGENDS</span>
    </div>
    <div class="players-grid" id="grid-past"></div>
  </section>

  <section class="era-section" id="section-modern">
    <div class="era-header">
      <div>
        <div class="era-badge gold">Modern Era</div>
        <h2 class="era-title">THE MODERN MASTERS</h2>
      </div>
      <span class="era-count">5 LEGENDS</span>
    </div>
    <div class="players-grid" id="grid-modern"></div>
  </section>

</div>

<footer class="site-footer">
  <div class="footer-left">
    <img class="footer-logo" src="image/Element/Logo.png" alt="LFC" />
    <span class="footer-brand">THE RED LEGENDS</span>
  </div>
  <nav class="footer-nav">
    <a href="index.html">Home</a>
    <a href="story.html">Legends</a>
    <a href="collection.html">Collection</a>
    <a href="about.html">About</a>
  </nav>
  <span class="footer-copy">Midterm Project · Pear · Liverpool FC</span>
</footer>

<script src="script.js"></script>
<script>
  function makeCard(p) {
    return `
      <a href="collection.html?id=${p.id}" class="player-card" title="${p.name}">
        <img class="player-card-img" src="${p.mainImage}" alt="${p.name}" loading="lazy" />
        <div class="player-card-overlay"></div>
        <div class="player-card-num-badge">#${p.number}</div>
        <div class="player-card-info">
          <div class="player-card-meta">${p.position} · ${p.years}</div>
          <div class="player-card-name">${p.name}</div>
          <div class="player-card-stat">
            <span>⚽ ${p.goals} Goals</span>
            <span>· ${p.appearances} Apps</span>
          </div>
        </div>
        <div class="player-card-cta">View Profile →</div>
      </a>`;
  }

  document.getElementById('grid-past').innerHTML   = getPastPlayers().map(makeCard).join('');
  document.getElementById('grid-modern').innerHTML = getModernPlayers().map(makeCard).join('');
</script>
</body>
</html>
